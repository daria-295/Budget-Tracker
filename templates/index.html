
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container">
        <h1>Personal Budget Tracker</h1>
        <br></br>
        <form id="transaction-form">
            <fieldset>
                <legend>What happened?</legend>

                <div class="type-options">
                    <label class="type-option">
                        <input type="radio" name="transaction_type"
                               value="income" required>
                        <span>💰 Received money</span>
                    </label>

                    <label class="type-option">
                        <input type="radio" name="transaction_type"
                               value="expense" required>
                        <span>💸 Spent money</span>
                    </label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="amount">Amount (£)</label>
                <input type="number" id="amount" name="amount"
                       min="0.01" max="999999999" step="0.01"
                       placeholder="e.g. 12.50" required>
            </div>

            <div class="form-group">
                <label for="note">Note (optional)</label>
                <input type="text" id="note" name="note"
                       maxlength="200"
                       placeholder="e.g. Tesco, Laundry">
            </div>

            <section id="expense-fields" hidden>
                <fieldset>
                    <legend>Was it a need or a want?</legend>

                    <div class="type-options">
                        <label class="type-option">
                            <input type="radio" name="need_or_want"
                                   value="Need">
                            <span>✅ Need</span>
                        </label>

                        <label class="type-option">
                            <input type="radio" name="need_or_want"
                                   value="Want">
                            <span>✨ Want</span>
                        </label>
                    </div>
                </fieldset>

                <div class="form-group">
                    <label for="reason">Reason for spending</label>

                    <select id="reason" name="reason">
                        <option value="">Choose a category...</option>

                        {% for category in categories %}
                        <option value="{{ category }}">
                            {{ category }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </section>

            <button type="submit" id="submit-button">
                Submit
            </button>

            <p id="form-message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
